<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login template</title>
    <!-- Main template css -->
    <link rel="stylesheet" href="css/login.css" />
    <!-- Render all Element Normally -->
    <link rel="stylesheet" href="css/normalize.css" />
    <!-- Website image icon -->
    <link rel="website icon" href="image/login.jpg" />
    <!-- Font Awsome -->
    <link rel="stylesheet" href="css/all.min.css" />
    <!-- Font google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- animation -->
    <link rel="stylesheet" href="css/animation.css" />
  </head>
  <body>
    <!-- start Header -->
    <div class="header">
      <div class="container">
        <div class="image">
          <span class="box-shadow"></span>
          <a href="#"> <img src="image/logo.png" alt="" /></a>
        </div>
        <div class="nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="#program">program</a></li>
            <li><a href="#service">service</a></li>
            <li><a href="#about">about</a></li>
            <li><a href="#community">community</a></li>
          </ul>
        </div>
        <a href="login.html" class="log">join now</a>
      </div>
    </div>
    <!-- End Header -->

    <!-- start form  -->
    <div class="form-login">
      <div class="container">
        <form>
          <h1>login</h1>
          <div class="one">
            <div class="user">
              <i class="fa-solid fa-user"></i>
              <input
                type="text"
                autofocus
                placeholder="userName"
                required
                name="userName"
              />
            </div>
            <div class="pass">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                placeholder="Password"
                required
                name="password"
              />
            </div>
          </div>
          <div class="remember">
            <div class="two">
              <input type="checkbox" />
              <label for="rememb">RememberMe</label>
            </div>

            <div class="text">
              <a href="#">forgot password ?</a>
            </div>
          </div>
          <button class="but-login">login</button>
          <p>or sign up using</p>
          <div class="sochial">
            <a href="https://www.facebook.com/profile.php?id=100060282253778">
              <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://www.google.co.uk/">
              <i class="fa-brands fa-google"></i>
            </a>
            <a href="https://www.instagram.com/abujood.l/">
              <i class="fa-brands fa-instagram"></i>
            </a>
          </div>
        </form>
      </div>
    </div>
    <!-- End form  -->
  </body>
</html>
